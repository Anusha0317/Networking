<body>

<a href="index.html" class="back">← Back</a>

<div class="container">

  <h1>Staff Dashboard</h1>

  <!-- CREATE -->
  <div class="section">
    <h3>Create New Parcel</h3>
    <input id="pid" placeholder="Parcel ID">
    <input id="name" placeholder="Parcel Name">
    <button onclick="addParcel()">Add Parcel</button>
  </div>

  <!-- UPDATE -->
  <div class="section">
    <h3>Update Parcel Status</h3>
    <input id="updateId" placeholder="Enter Parcel ID">

    <select id="updateStatus">
      <option>In Transit</option>
      <option>Out for Delivery</option>
      <option>Delivered</option>
    </select>

    <button onclick="updateParcel()">Update Status</button>
  </div>

  <!-- DELETE -->
  <div class="section">
    <h3>Delete Parcel</h3>
    <input id="deleteId" placeholder="Enter Parcel ID">
    <button class="delete-btn" onclick="deleteParcel()">Delete Parcel</button>
    <button onclick="window.location.href='parcels.html'">
      View All Parcels
    </button>
  </div>

</div>

<script src="staff.js"></script>

</body>
