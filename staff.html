<!DOCTYPE html>
<html>
<head>
  <title>Staff Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<a href="index.html" class="back">&#8592; Back</a>

<div class="container">

  <h1>Staff Dashboard</h1>

  <!-- 📊 STATS BOX -->
  <div class="stats">

    <div class="card total">
      <h2 id="totalCount">0</h2>
      <p>Total Parcels</p>
    </div>

    <div class="card delivered">
      <h2 id="deliveredCount">0</h2>
      <p>Delivered</p>
    </div>

    <div class="card transit">
      <h2 id="transitCount">0</h2>
      <p>In Transit</p>
    </div>

    <div class="card out">
      <h2 id="outCount">0</h2>
      <p>Out for Delivery</p>
    </div>

  </div>
  <!-- CREATE -->
  <div class="section">
    <h3>Create New Parcel</h3>
    <input type="text" id="parcelId" placeholder="Parcel ID">
<input type="text" id="parcelName" placeholder="Parcel Name">

<input type="text" id="customerName" placeholder="Customer Name">
<input type="email" id="email" placeholder="Customer Email">
<input type="text" id="address" placeholder="Address">
<input type="date" id="date">

<button type="button"onclick="addParcel()">Add Parcel</button>
<button type="button" onclick="resetCreateForm()">Reset</button>
</div>

  <!-- UPDATE -->
  <div class="section">
    <h3>Update Parcel Status</h3>
    <input id="updateId" placeholder="Enter Parcel ID">

    <select id="updateStatus">
      <option>In Transit</option>
      <option>Out for Delivery</option>
      <option>Delivered</option>
    </select>

    <button type="button"onclick="updateParcel()">Update Status</button>
<button type="button"onclick="resetUpdateForm()">Reset</button>
  </div>

  <!-- DELETE -->
  <div class="section">
    <h3>Delete Parcel</h3>
    <input id="deleteId" placeholder="Enter Parcel ID">

    <button class="delete-btn" onclick="deleteParcel()">
      Delete Parcel
<button type="button"onclick="resetDeleteForm()">Reset</button>
    </button>
  </div>

  <!-- SEARCH -->
<div class="section">
    <h3>Search Parcel</h3>
    <input type="text" id="searchId" placeholder="Enter Parcel ID">
    <button type="button"onclick="searchParcel()">Search Parcel</button>
<button type="button"onclick="resetSearchForm()">Reset</button>
</div>

  <!-- VIEW -->
  <div class="section">
    <h3>View All Parcels</h3>

    <button onclick="window.location.href='parcels.html'">
      View All Parcels
    </button>
  </div>
</div>
<!-- JS FILE -->
<script src="staff.js"></script>

</body>
</html>
